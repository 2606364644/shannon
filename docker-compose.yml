networks:
  default:
    name: shannon-py-net

services:
  temporal:
    # 默认自建：裸 docker compose up 即起此服务。
    # 复用外部 temporal 时，docker-compose.override.external-temporal.yml
    # 会给本服务加 profiles:[disabled] 让它不启动，并改 web 连外部 temporal。
    # ./scripts/up.sh 自动判断走哪条路。
    image: temporalio/temporal:latest
    container_name: shannon-py-temporal
    command: ["server", "start-dev", "--db-filename", "/home/temporal/temporal.db", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:7233:7233"   # gRPC
      - "127.0.0.1:8233:8233"   # Web UI (built-in)
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: shannon-py-web
    ports:
      - "${SHANNON_WEB_PORT:-7878}:7878"
    volumes:
      - ./workspaces:/app/workspaces
      - ./repos:/app/repos
      - ./configs:/app/configs
      - ./.env:/app/.env:ro
      # .env.profiles 含 SHANNON_PROFILE 对应的引擎密钥（glm-anthropic.env 等），
      # 是 load_env() 启动扫描的硬依赖；不挂载则新扫描启动即崩 "profile 文件不存在"。
      # 同 .env 走 bind mount（宿主 gitignore 排除，随改随生效免重建）。
      - ./.env.profiles:/app/.env.profiles:ro
    env_file:
      - .env
    environment:
      - SHANNON_WEB_MAX_CONCURRENT=${SHANNON_WEB_MAX_CONCURRENT:-1}
      - SHANNON_WEB_SCAN_TIMEOUT=${SHANNON_WEB_SCAN_TIMEOUT:-0}
      - SHANNON_TEMPORAL_HOST=temporal
      - SHANNON_TEMPORAL_PORT=7233
    depends_on:
      temporal:
        condition: service_healthy

  worker:
    # C1 Phase A：常驻 worker 容器，消费 WEB 固定 task queue（白盒 shannon-py-wb-web / 黑盒 shannon-py-bb-web）。
    # 装齐 gitnexus+agent-browser+chrome（共用镜像）；web 容器保持瘦。
    # Plan 1 阶段 web 仍 fork（仍 broken），worker 起着暂无提交者——Plan 2 scan_manager 改 start_workflow 后才消费。
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: shannon-py-worker
    volumes:
      - ./workspaces:/app/workspaces
      - ./repos:/app/repos
      - ./configs:/app/configs
      - ./.env:/app/.env:ro
      - ./.env.profiles:/app/.env.profiles:ro
    env_file:
      - .env
    environment:
      - SHANNON_TEMPORAL_HOST=temporal
      - SHANNON_TEMPORAL_PORT=7233
      - SHANNON_TEMPORALIO_LOG_LEVEL=${SHANNON_TEMPORALIO_LOG_LEVEL:-WARNING}
    depends_on:
      temporal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${SHANNON_WORKER_CPUS:-2}'
          memory: '${SHANNON_WORKER_MEMORY:-4g}'
    restart: unless-stopped

volumes:
  temporal-data:
