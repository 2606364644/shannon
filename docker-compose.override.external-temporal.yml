# docker-compose.override.external-temporal.yml
# ─────────────────────────────────────────────────────────────────────────────
# 【复用模板 · 入库可分享】复用本机已存在的外部 temporal 容器
#
# 适用场景：
#   本机已有独立运行、被多个项目共用的 temporal 容器
#   （例如容器名 shannon-temporal，在 shannon-net 网络，占 127.0.0.1:7233），
#   不想让 compose 再自建 temporal 抢 7233。
#
# 用法（二选一）：
#
#   方式 A（推荐 · 自动）：
#     ./scripts/up.sh        # 脚本检测 7233 端口自动加载本模板
#
#   方式 B（手动）：
#     docker compose -f docker-compose.yml \
#                    -f docker-compose.override.external-temporal.yml \
#                    up -d --build web
#
# 切回"自建 temporal"模式（默认，干净环境）：
#     docker compose up -d --build web    # 不加载本模板即自建
#
# 机制：
#   - 给 temporal 服务加 profiles:["disabled"]，默认不启动（不抢 7233）
#   - web 的 depends_on 清空（temporal 不在 compose 管辖）
#   - web 改用容器名 shannon-temporal 直连，并接入 shannon-net 外部网络
#
# 前提：
#   - 外部 temporal 容器在运行，容器名 = shannon-temporal（见 SUPERNOVA_TEMPORAL_HOST）
#   - 存在 docker 网络名 shannon-net
#   若你的容器名/网络名不同，改下方两处即可。
# ─────────────────────────────────────────────────────────────────────────────

services:
  temporal:
    # 让 compose 不启动此服务（用永不激活的 profile 隐藏它）
    profiles: ["disabled"]

  web:
    depends_on: !reset []
    environment:
      # 容器名直连：shannon-py-temporal 在 shannon-py-net 网络里可被 DNS 解析
      # （绕开外部 temporal 绑 127.0.0.1 致容器够不到的限制）
      - SUPERNOVA_TEMPORAL_HOST=shannon-py-temporal
      - SUPERNOVA_TEMPORAL_PORT=7233
    networks:
      - default          # 保留 supernova-net（compose 内部通信）
      - shannon-py-net   # 接入外部 temporal 所在网络

  worker:
    # 镜像 web 块：清空 depends_on（temporal 不在 compose 管辖）+
    # 直连外部 shannon-py-temporal + 接入 shannon-py-net。
    depends_on: !reset []
    environment:
      - SUPERNOVA_TEMPORAL_HOST=shannon-py-temporal
      - SUPERNOVA_TEMPORAL_PORT=7233
    networks:
      - default          # 保留 supernova-net（compose 内部通信）
      - shannon-py-net   # 接入外部 temporal 所在网络

networks:
  shannon-py-net:
    external: true       # 复用已存在的 shannon-py-net，不新建
