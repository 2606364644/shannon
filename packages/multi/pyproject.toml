[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shannon-multi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shannon-core",
    "shannon-whitebox",
]

[project.scripts]
shannon-multi = "shannon_multi.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shannon_multi"]
