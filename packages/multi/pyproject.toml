[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supernova-multi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "supernova-core",
    "supernova-whitebox",
]

[project.scripts]
supernova-multi = "supernova_multi.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/supernova_multi"]
