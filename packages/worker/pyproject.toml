[project]
name = "supernova-worker"
version = "0.1.0"
description = "Shannon 常驻 worker 容器入口（消费 WEB 固定 task queue，聚合白盒+黑盒 workflow）"
requires-python = ">=3.12"
dependencies = [
    "supernova-core",
    "supernova-whitebox",
    "supernova-blackbox",
    "temporalio>=1.7",
]

[project.scripts]
supernova-worker = "supernova_worker.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supernova_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
