<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Inter 仅 mac 主题在非 Apple 平台消费（--font-sans SF 栈回落，2026-08-25
         Apple 质感修订；字体文件只在对应字体被渲染文本使用时才下载） -->
    <title>Supernova</title>
    <script>
      (function () {
        try {
          // 与 theme.ts applyTheme 同语义（防 FOAC 首帧闪基础主题）：
          // 主题 → mode class + palette class；旧值 dark/light/frost 读时归一；
          // system/无/非法 → 按 prefers 落默认主题对（浅=warm-paper / 深=charcoal；
          // 2026-08-27 默认浅色回切品牌基准，与 theme.ts defaultThemeFor 同源）。
          var DEF = {
            charcoal: ["dark"],
            midnight: ["dark", "theme-midnight"],
            graphite: ["dark", "theme-graphite"],
            sentry: ["dark", "theme-sentry"],
            arc: ["dark", "theme-arc"],
            mission: ["dark", "theme-mission"],
            ember: ["dark", "theme-ember"],
            catppuccin: ["dark", "theme-catppuccin"],
            "rose-pine": ["dark", "theme-rose-pine"],
            gruvbox: ["dark", "theme-gruvbox"],
            dracula: ["dark", "theme-dracula"],
            mac: ["light", "theme-mac"],
            github: ["light", "theme-github"],
            notion: ["light", "theme-notion"],
            kami: ["light", "theme-kami"],
            blueprint: ["light", "theme-blueprint"],
            // 2026-08-26 亮色材质升级：warm-paper 获材质专用 palette class（画布纸纹）
            "warm-paper": ["light", "theme-warm-paper"],
            // 2026-08-27 openai 主题补录（此前漏更：stored=openai 首帧错挂默认对再闪变）
            openai: ["light", "theme-openai"],
            "catppuccin-latte": ["light", "theme-catppuccin-latte"],
            "rose-pine-dawn": ["light", "theme-rose-pine-dawn"],
            "gruvbox-light": ["light", "theme-gruvbox-light"],
            "solarized-light": ["light", "theme-solarized-light"],
          };
          var legacy = { dark: "charcoal", light: "warm-paper", frost: "mac" };
          var t = localStorage.getItem("supernova-theme");
          if (legacy[t]) t = legacy[t];
          if (!DEF[t]) {
            // 默认主题对（2026-08-27 用户决策）：深色=graphite / 浅色=openai，与 theme.ts defaultThemeFor 同源同步
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "openai" : "graphite";
          }
          var cl = document.documentElement.classList;
          DEF[t].forEach(function (c) {
            cl.add(c);
          });
        } catch (e) {
          // 异常兜底与默认深色 graphite 一致（mode + palette，防首帧 token 闪变）
          document.documentElement.classList.add("dark", "theme-graphite");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
