<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Supernova</title>
    <script>
      (function () {
        try {
          // 与 theme.ts applyTheme 同语义（防 FOAC 首帧闪基础主题）：
          // 主题 → mode class + palette class；旧值 dark/light/frost 读时归一；
          // system/无/非法 → 按 prefers 落默认主题对（浅=mac / 深=charcoal）。
          var DEF = {
            charcoal: ["dark"],
            midnight: ["dark", "theme-midnight"],
            graphite: ["dark", "theme-graphite"],
            sentry: ["dark", "theme-sentry"],
            arc: ["dark", "theme-arc"],
            mission: ["dark", "theme-mission"],
            mac: ["light", "theme-mac"],
            github: ["light", "theme-github"],
            notion: ["light", "theme-notion"],
            kami: ["light", "theme-kami"],
            "warm-paper": ["light"],
          };
          var legacy = { dark: "charcoal", light: "warm-paper", frost: "mac" };
          var t = localStorage.getItem("supernova-theme");
          if (legacy[t]) t = legacy[t];
          if (!DEF[t]) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "mac" : "charcoal";
          }
          var cl = document.documentElement.classList;
          DEF[t].forEach(function (c) {
            cl.add(c);
          });
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
