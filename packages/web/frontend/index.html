<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Supernova</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("supernova-theme");
          // "system" 或非法值 → 读 prefers-color-scheme 解析为 dark/light
          // （system 是逻辑态，<html> 只挂 dark/light；旧 dark/light 向后兼容）
          if (t === "system" || (t !== "dark" && t !== "light")) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
