[project]
name = "supernova-web"
version = "0.1.0"
description = "Shannon Web Platform backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "supernova-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.0",
    "aiofiles>=23.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[project.scripts]
supernova-web = "supernova_web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supernova_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
