[project]
name = "supernova-combined"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "supernova-core",
    "supernova-whitebox",
    "supernova-blackbox",
    "click>=8.0",
]

[project.scripts]
shannon = "supernova_combined.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supernova_combined"]
