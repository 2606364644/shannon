[project]
name = "supernova-whitebox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "supernova-core",
    "temporalio>=1.0",
    "click>=8.0",
    "aiofiles>=23.0",
]

[project.scripts]
supernova-whitebox = "supernova_whitebox.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supernova_whitebox"]
