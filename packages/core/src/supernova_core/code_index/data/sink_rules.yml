# Sink 规则库 —— 映射 SinkRule(sink_detector.py)。
#
# 字段:
#   rule_id              规则标识(唯一)
#   languages            适用语言列表
#   callee               被调函数/方法名(精确字符串;loader 不动大小写 —— Go "Raw" 大写是导出语义)
#   receiver_pattern     receiver 正则字符串(null = 裸调用,无 receiver);现有全是 ^...$ 锚定、无 flag
#   category             SinkCategory 枚举值:sql/command/file/template/deserialization/ssrf/xss/log/redirect
#   sink_subtype         细分类型,如 sql_raw / command_shell
#   dangerous_slots      危险参数位列表;每项 {arg_index, slot}
#                          slot ∈ SlotContext:sql_value/sql_identifier/cmd_argument/file_path/template_expr/url/deserialize/generic
#   needs_review_default 省略即 false;true 表示静态精度不足、需 Spec C LLM 复核
#
# 未知 category/slot 值 → loader fail-fast(ValueError),不回落。

rules:
  # ===== SQL =====
  - rule_id: py-db-cursor-execute
    languages: [python]
    callee: execute
    receiver_pattern: "^(cursor|cnx|conn|db|database|session)$"   # §1.3.13 加 session:覆盖 SQLAlchemy session.execute(text(...))
    category: sql
    sink_subtype: sql_raw
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  - rule_id: py-db-cursor-executemany
    languages: [python]
    callee: executemany
    receiver_pattern: "^(cursor|cnx|conn|db|database|session)$"
    category: sql
    sink_subtype: sql_raw
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  - rule_id: ts-db-query
    languages: [typescript]
    callee: query
    receiver_pattern: null
    category: sql
    sink_subtype: sql_raw
    needs_review_default: true   # receiver unknown for `db.query`
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  - rule_id: go-db-query
    languages: [go]
    callee: Query
    receiver_pattern: ".+"          # 原 null(只匹配裸 Query)→ .+ 覆盖 db.Query
    category: sql
    sink_subtype: sql_raw
    needs_review_default: true
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  - rule_id: java-stmt-executequery
    languages: [java]
    callee: executeQuery
    receiver_pattern: ".+"          # 原 null(只匹配裸调用,Java 不存在)→ .+ 任意 receiver
    category: sql
    sink_subtype: sql_raw
    needs_review_default: true      # rp=.+ 静态精度不足,交 chain_verdict LLM 复核
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  - rule_id: java-stmt-execute
    languages: [java]
    callee: execute
    receiver_pattern: ".+"          # 原 null(只匹配裸调用)→ .+ ;execute 横跨 SQL+SSRF,
    category: sql                   #   保留 sql 语义,SSRF 由 java-httpclient-execute 覆盖,
    sink_subtype: sql_raw           #   双命中靠 chain_verdict 复核否决(不漏 DDL)
    needs_review_default: true
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  - rule_id: php-mysqli-query
    languages: [php]
    callee: query
    receiver_pattern: "^(mysqli|pdo|db|DB)$"
    category: sql
    sink_subtype: sql_raw
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  - rule_id: php-db-select-static
    languages: [php]
    callee: select
    receiver_pattern: "^(DB)$"
    category: sql
    sink_subtype: sql_raw
    dangerous_slots: [{arg_index: 0, slot: sql_value}]

  # ===== ORM Raw / string-built SQL(最高漏报类)=====
  - rule_id: py-django-raw
    languages: [python]
    callee: raw
    receiver_pattern: "^(objects)$"
