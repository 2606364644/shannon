    receiver_pattern: "^(child_process|cp)$"   # 原 null;惯例 import 名 child_process/cp
    category: command
    sink_subtype: command_exec
    needs_review_default: true   # callee common; receiver check via 'child_process'
    dangerous_slots: [{arg_index: 0, slot: cmd_argument}]

  # ===== §1.1 RCE(deepsec 吸收,matchers/rce.ts)=====
  # 注:new Function("return "+body) 是 new_expression,iter_calls() 不抽取(探针验证
  # callee 抽出为空)→ 不上规则,归 §4.2 detector 能力项(new_expression 支持)。
  - rule_id: ts-child-process-execsync
    languages: [typescript, javascript]
    callee: execSync
    receiver_pattern: null   # 裸调用;解构 import { execSync } from 'child_process' 后直调为主
    category: command
    sink_subtype: command_exec
    dangerous_slots: [{arg_index: 0, slot: cmd_argument}]
    examples:
      positive: ["function f(cmd){ return execSync(cmd); }"]
      negative: ["function f(cmd){ return child.execSync(cmd); }"]

  - rule_id: ts-child-process-spawn
    languages: [typescript, javascript]
    callee: spawn
    receiver_pattern: null   # 裸调用;解构 import { spawn } from 'child_process' 后直调
    category: command
    sink_subtype: command_exec
    needs_review_default: true   # spawn 词稍泛;裸调用语义专一(JS 无内置 spawn 全局)
    dangerous_slots: [{arg_index: 0, slot: cmd_argument}]

  - rule_id: ts-child-process-spawn-qualified
    languages: [typescript, javascript]
    callee: spawn
    receiver_pattern: "^(cp|childProcess|child_process)$"   # cp.spawn(cmd) / child_process.spawn(cmd)
    category: command
    sink_subtype: command_exec
    needs_review_default: true
    dangerous_slots: [{arg_index: 0, slot: cmd_argument}]

  - rule_id: ts-child-process-spawnsync
    languages: [typescript, javascript]
    callee: spawnSync
    receiver_pattern: null   # 裸调用;解构 import 后直调
