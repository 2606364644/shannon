  # --- Angular 显式 bypass XSS(juice-shop 10 处 bypassSecurityTrustHtml)---
  # 显式 sink(开发者主动 bypass sanitizer,不像 innerHTML 到处都是 → 误报低)。
  # needs_review 交 LLM 确认数据可控;即使前端组件非 entry point,也作 sink 标记供 LLM 轨用。
  - rule_id: ts-bypass-security-trust-html
    languages: [typescript, javascript]
    callee: bypassSecurityTrustHtml
    receiver_pattern: "^(sanitizer|domSanitizer|Sanitizer|sanitizerService)$"
