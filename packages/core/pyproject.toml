[project]
name = "supernova-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=23.0",
    "python-dotenv>=1.0",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-php>=0.23",
    "claude-agent-sdk>=0.2.118,<0.3",
    "anthropic>=0.40",
    "openai>=2.45.0",
    "openai-agents>=0.18.2,<0.19",
    "temporalio>=1.0",
    "watchdog>=4.0",
    "rich>=13.7.0",
    "proxy.py>=2.4.10",
    "openai-codex>=0.144,<0.145",
]

[project.scripts]
generate-totp = "supernova_core.scripts.generate_totp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supernova_core"]

# 规则 YAML(sink/source/sink_candidates)是首批包内非 .py 数据。hatch 默认 wheel 只打
# .py,必须显式 force-include,否则 pip install 后运行 FileNotFoundError。editable install
# 不暴露此问题(Path(__file__).parent 指向源码)—— 隐性陷阱,靠 wheel 构建冒烟测试覆盖。
[tool.hatch.build.targets.wheel.force-include]
"src/supernova_core/code_index/data" = "supernova_core/code_index/data"
